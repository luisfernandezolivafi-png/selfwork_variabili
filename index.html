<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Variabili</title>
</head>
<body>

    <script>
        let num1 = 10;
        let num2 = 25;

        console.log(num1);
        console.log(num2);

        let stringa = "Ciao Aulab";
        console.log(stringa);

        stringa = "Sto imparando JavaScript";
        console.log(stringa);

        const PIGRECO = 3.14159265359;
        console.log(PIGRECO);

        PIGRECO = 3;
        console.log(PIGRECO);
    </script>
</body>
</html>
